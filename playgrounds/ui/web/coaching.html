<!doctype html>
<!-- Coaching flows design study, Nov 2026: three clickable flows on real swing frames and real coaching output.
     1 Auto, one swing: verdict on the thumbnail, review paused on the fault, checks sheet with per-check toggles.
     2 Auto, every few swings: how often the coach speaks, the five-swing recap, the same position compared.
     3 At home: session review with the main pattern, the chain, worst against best, charts and sourced drill ideas.
     Data: ../media/coaching/data.js (window.COACHING) and ../media/coaching/<session>/<swing>/p01..p10.jpg, written by
     playgrounds/ui/coaching-media.py. Local only, not in Git. Everything on screen is computed from that file;
     the only fixed copy is the drill ideas (IDEAS), each quoted from a repo source.
     Query: session=<label>, flow=1|2|3, screen=capture|review|compare|library|session, swing=<n>, pos=<1-10>,
     sheet=checks|speak, draw=coach|all|mine, said=1, speak=each|five|ask, taken=<0-5>, recap=1, cmp=grid|over, scroll=<px>. -->
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwingCoach · Coaching flows</title>
<style>
:root{--fg:#ecefea;--mute:#9aa29a;--cardbg:#181b19;--line:#2a2f2b;--acc:#d8f36a;--yel:#ffd60a;
  --g:#3ddb6e;--a:#ffbf29;--r:#ff5445;--n:#8e8e93;--s1:#1c1c1e;--s2:#2c2c2e;--sep:#3a3a3c;--t2:#a1a1a8}
*{box-sizing:border-box}
html{background:#0e100f;color:var(--fg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:var(--fg);margin:0 auto;max-width:1000px;padding:20px 24px 40px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}

.hy{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);grid-template-areas:"phone ctrls" "phone notes";grid-template-rows:auto 1fr;column-gap:28px;align-items:start}

.seg button.on{background:var(--fg);color:#111}
.seglab{font-size:11px;color:var(--mute);width:62px;flex:none}
.step{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:18px;font-size:12px;padding:3px}
.step button{width:26px;height:26px;border-radius:13px;color:var(--mute);text-align:center;font-size:15px;line-height:1}
.step button:hover{color:var(--fg);background:#ffffff14}
.step span{padding:0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}

.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y}.scroll::-webkit-scrollbar{display:none}

/* tab bar */

.thumb{width:44px;height:58px;border-radius:8px;overflow:hidden;position:relative;flex:none;background:#ffffff1f;box-shadow:0 0 0 1px #ffffff80}

.spin{width:14px;height:14px;border-radius:50%;border:2px solid #ffffff40;border-top-color:#fff;animation:spin .8s linear infinite;flex:none}
.pips{position:absolute;right:14px;bottom:166px;z-index:7;display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:19px 19px 6px 19px;background:#000000a6;border:.5px solid #ffffff24;font-size:12px;font-weight:600;color:#ffffffcc}

.more .ic{width:12px;height:12px;stroke-width:2.6}

.vid svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.slot{width:70px;display:flex}.slot.r{justify-content:flex-end}
.rail{position:absolute;right:14px;top:108px;z-index:7;display:flex;flex-direction:column;gap:10px}.rail.auto{top:60px}
.said2{position:absolute;left:14px;top:108px;z-index:6;max-width:296px;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.pill{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:20px;background:#0000008c;border:.5px solid #ffffff24;font-size:14px;font-weight:600;line-height:1.25}

.capn .dot{width:8px;height:8px}.capn em{font-style:normal;font-size:12px;font-weight:500;color:#ffffffb3;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl{position:absolute;left:16px;right:16px;bottom:136px;height:28px;z-index:7;touch-action:none;cursor:pointer}

.trans{position:absolute;left:22px;right:22px;bottom:94px;height:40px;display:flex;align-items:center;z-index:7}
.readout{width:58px;font:600 13px ui-monospace,"SF Mono",Menlo,monospace;color:#ffffffd9}
.trans .mid{flex:1;display:flex;justify-content:center;gap:26px;align-items:center}
.tbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center}.tbtn svg{width:19px;height:19px;fill:#fff}.tbtn.play svg{width:24px;height:24px}
.lockw{width:58px}
.strip{position:absolute;left:12px;right:12px;bottom:30px;height:56px;display:flex;justify-content:space-between;align-items:center;z-index:7;padding:0 2px;border-radius:28px;background:#0000005c;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:.5px solid #ffffff1f;touch-action:none;cursor:pointer}
.chip{width:34px;height:46px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;pointer-events:none}

.g-body{stroke:currentColor;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round;fill:none}.g-head{fill:currentColor}
.g-club{stroke:var(--acc);stroke-width:2.1;stroke-linecap:round;fill:none}.chip.on .g-club{stroke:#5d7d00}.g-ball{fill:currentColor;opacity:.75}

/* sheets */
.scrim{position:absolute;inset:0;background:#0006}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:30px 30px 0 0;background:var(--s1);display:flex;flex-direction:column;box-shadow:0 -10px 40px #0009}
.sheet.fresh{animation:rise .34s cubic-bezier(.2,.85,.3,1)}
.grab{width:36px;height:5px;border-radius:3px;background:#5a5a5e;margin:7px auto 0;flex:none}
.sheet h2{font-size:16px;font-weight:650;text-align:center;margin:12px 0 10px;flex:none}
.sheet .scroll{flex:1;padding:0 16px 44px}
.grp{background:var(--s2);border-radius:14px;margin-bottom:8px;overflow:hidden}
.gh{font-size:13px;font-weight:600;color:var(--t2);margin:16px 4px 7px}
.sum{padding:12px 14px}.sum b{display:block;font-size:16px;font-weight:650;line-height:1.25}.sum span{display:block;font-size:13px;color:var(--t2);margin-top:3px}
.dseg{display:flex;margin:10px 12px 0;padding:2px;border-radius:9px;background:#7676803d}
.dseg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:500;text-align:center}.dseg button.on{background:#636366;font-weight:600}
.dnote{font-size:12px;color:var(--t2);line-height:1.4;padding:8px 14px 12px}
.mrow{display:flex;align-items:center;gap:11px;padding:9px 12px 9px 12px;min-height:54px;position:relative}

.mrow .val{font-size:14px;color:var(--t2);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);flex:none;font-variant-numeric:tabular-nums}
.meter .ic{width:14px;height:14px;stroke-width:3}
.sw{width:44px;height:27px;border-radius:14px;background:#39393d;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:23px;height:23px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px #0006}
.sw.on{background:#30d158}.sw.on::after{transform:translateX(17px)}
.foot{font-size:12px;color:var(--t2);line-height:1.45;padding:2px 4px}
.orow{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative}
.orow+.orow::before{content:"";position:absolute;left:14px;right:0;top:0;border-top:.5px solid var(--sep)}
.orow .tx{flex:1;font-size:16px}.orow .tx small{display:block;font-size:12px;color:var(--t2);margin-top:2px;line-height:1.35}
.orow .ck{width:20px;color:var(--acc);opacity:0}.orow.on .ck{opacity:1}.orow .ck .ic{stroke-width:2.8}

/* pushed screens: compare, library, session */
.page{position:absolute;inset:0;background:#000;display:flex;flex-direction:column}
.nav{flex:none;height:106px;padding:60px 14px 0;display:flex;align-items:flex-start;justify-content:space-between;position:relative}

.page .scroll{flex:1;padding:0 12px 44px}
.cseg{display:flex;margin:0 auto 10px;width:230px;padding:2px;border-radius:9px;background:#7676803d}

// ---------- data helpers
const DEF=Object.fromEntries(C.definitions.map(d=>[d.id,d]));

C.sessions.forEach(s=>s.swings.forEach(w=>{w.report.metrics=w.report.metrics.filter(m=>DEF[m.id]);w.positions=[...w.positions].sort((a,b)=>a.number-b.number)}));
const NAMES=["Address","Takeaway","Lead arm parallel","Top","Lead arm parallel down","Shaft parallel down","Impact","Shaft parallel through","Arm parallel through","Finish"];
const pname=p=>`P${p} ${(NAMES[p-1]||'').toLowerCase()}`.trim();
const MEDIA='../media/coaching/';
const frame=(w,p)=>encodeURI(`${MEDIA}${w.frames}/p${String(p).padStart(2,'0')}.jpg`);

const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
function sName(label){
 const m=/^(.*?)[-_ ]?(\d{4})-(\d{2})-(\d{2})$/.exec(label);
 if(m){const d=new Date(+m[2],+m[3]-1,+m[4]),mon=d.toLocaleDateString('en-GB',{month:'short'});
  return{tab:`${+m[4]} ${mon}${m[1]?' '+m[1]:''}`,day:d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}),kind:m[1]?m[1][0].toUpperCase()+m[1].slice(1):'',dated:true}}
 if(label==='pros')return{tab:'Tour pros',day:'Tour pros',kind:'Reference clips',dated:false};
 return{tab:label,day:label,kind:'',dated:false}}
C.sessions.forEach(s=>s.name=sName(s.label));
// Which fault a metric reading belongs to: read from the data's own verdicts and themes first,
// then CoachingFault.fault(for:) in CoachingFeedback.swift as [below, above].
const FAULT_CODE={setupPosture:['setup','setup'],setupHands:['setup','setup'],takeawayClub:['takeaway','takeaway'],planeTakeaway:['takeaway','takeaway'],
 shaftHalfwayBack:['backswingPlane','backswingPlane'],leadArmTop:['topPosition','topPosition'],handDepthTop:['topPosition','topPosition'],
 hipDepthTop:['backswingPosture','backswingPosture'],headHeightTop:['backswingPosture','backswingPosture'],headDepthTop:['backswingPosture','backswingPosture'],postureTop:['backswingPosture','backswingPosture'],
 transition:['flatTransition','steepTransition'],shaftHalfwayDown:['steepTransition','flatTransition'],planeDelivery:['flatTransition','steepTransition'],
 hipDepthImpact:[null,'earlyExtension'],postureImpact:['earlyExtension',null],headHeightImpact:['headAtImpact','earlyExtension'],handsHeightImpact:['handsAtImpact','earlyExtension'],

const FAULT_DATA={};
C.sessions.forEach(s=>{s.themes.forEach(t=>FAULT_DATA[t.metric+':'+Math.sign(t.medianLevel)]=t.fault);
 s.swings.forEach(w=>{const v=w.verdict;if(v.kind==='focus'&&v.metric&&v.fault)FAULT_DATA[v.metric+':'+Math.sign(v.level)]=v.fault})});
const faultOf=(id,sign)=>FAULT_DATA[id+':'+sign]||(FAULT_CODE[id]||[])[sign<0?0:1]||null;

// ---------- drill and feel ideas. Each is a short paraphrase of one sourced case in the repo. Not reviewed by a coach.
// `when` lists the readings it answers as [metric, side]; `fault` matches any reading of that fault.
const IDEAS=[
 {id:'stick',prop:'Stick or broom handle',title:'Hands inside the stick, clubhead outside',when:[['takeawayClub',-1],['shaftHalfwayBack',1]],
  steps:['Stand a stick about two feet behind you so it covers your hands from down the line.','Take the club back with your hands inside the stick and the clubhead outside it.'],
  why:'The coach says this should make the shaft point inside the ball halfway back.',
  feel:'Hands in toward your trail pocket as you turn, clubhead outside them.',
  who:'Dom Caminiti, Ryan backswing review',file:'docs/coaching-knowledge/sources/DVI2JDpDC5Z.md',limit:'The stick is drawn on the student’s video. The source does not show the drill being done.'},
 {id:'doorframe',prop:'Door frame or wall',title:'A wall the clubhead can’t get behind',when:[['takeawayClub',-1]],
  steps:['Use a wall or door frame as a boundary so the clubhead can’t sneak behind your hands going back.'],
  why:'Good players keep the clubhead up and outside the hands; the boundary forces that shape.',
  feel:'Clubhead up and outside the hands going back.',
  who:'Dom Caminiti, reel DZynZu9goX0',file:'docs/DOMCAMINITI_VIDEO_ANNOTATION_REFERENCE.md',limit:'The repo note records the prop and the checkpoint, not where to stand.'},
 {id:'walltop',prop:'Wall',title:'Rehearse the top against a wall',when:[['leadArmTop',1],['handDepthTop',1]],
  steps:['At the top, rest the back of your trail arm, your trail hand and the shaft against a wall.'],
  why:'Meant to put the lead arm on the shoulder plane and the hands over the heels.',
  feel:'Hands over the heels at the top.',
  who:'Dom Caminiti, Ryan backswing review',file:'docs/coaching-knowledge/sources/DVI2JDpDC5Z.md',limit:'Shown as a drawn wall line. No real wall rehearsal is in the source.'},
 {id:'noroll',prop:'No prop',title:'Hands go with the turn, no early roll',when:[['handDepthTop',-1]],
  steps:['Let your hands travel with your turn instead of rolling the forearms early.','Hinge the club upward so it stays outside your hands.'],
  why:'In the source, an early forearm roll put the club deep and pulled the hands too far behind the heels.',
  feel:'Hands go with the turn. Hinge the club up, don’t roll it behind you.',
  who:'Teagan Moore, Kyle’s two-month progression',file:'docs/coaching-knowledge/sources/Dcthf1xDWe9.md',limit:'The coach’s cause and effect is unmeasured.'},
 {id:'basket',prop:'Laundry basket or bucket',title:'Basket at the trail foot',fault:'earlyExtension',
  steps:['Tip a basket over your trail foot.','Swing without your trail shin pushing into the top of it.'],
  why:'It discourages the knee and hip driving toward the ball.',
  feel:'Trail hip stays back. Turn through.',
  who:'Jenny Kim, four early-extension drills',file:'docs/coaching-knowledge/sources/DdHAGJkKLFB.md',limit:'A demonstration. No before and after is shown.'},
 {id:'toes',prop:'Golf ball',title:'Ball under the trail toes',fault:'earlyExtension',
  steps:['Put a ball under your trail toes.','Make controlled swings. Feel less pressure in the toes and the trail hip staying back.'],
  why:'Less push into the trail toes leaves room to turn through.',
  feel:'Light on the trail toes. Turn through.',
  who:'Jenny Kim, four early-extension drills',file:'docs/coaching-knowledge/sources/DdHAGJkKLFB.md',limit:'A demonstration. No before and after is shown.'},
 {id:'understick',prop:'Stick or broom handle',title:'Swing under the stick',fault:'steepTransition',
  steps:['Set a stick about two feet behind you with its end just above your hands, seen from down the line.','Start slowly and swing under it.'],
  why:'Only once setup and backswing are right, and not with an open clubface.',
  feel:'Slow, and under the stick.',
  who:'Teagan Moore, shallowing barrier',file:'docs/coaching-knowledge/sources/DcwID0KRE5Q.md',limit:'The source says to fix an open face first, or the miss right gets worse.'}];
const ideasFor=(id,sign)=>{const f=faultOf(id,sign);return IDEAS.filter(i=>(i.when||[]).some(([m,s])=>m===id&&s===sign)).concat(IDEAS.filter(i=>i.fault&&i.fault===f))};

// ---------- state
const Q=new URLSearchParams(location.search);
const S={si:0,flow:1,screen:'capture',swing:0,hit:false,phase:'idle',rv:{i:0,pos:1,from:'capture'},hl:null,sheet:null,fresh:null,
 draw:'coach',mine:{},speak:'each',block:0,taken:0,recap:false,cmp:{id:null,mode:'grid'},busy:false,playing:false};
const sess=()=>C.sessions[S.si],SW=()=>sess().swings,N=()=>SW().length,BL=()=>Math.min(5,N());
const five=()=>S.speak!=='each';
const lastIdx=()=>five()?S.block+S.taken-1:(S.hit?S.swing:S.swing-1);
const nextIdx=()=>{const i=five()?(S.taken<BL()?S.block+S.taken:S.block+BL()):(S.hit?S.swing+1:S.swing);return i>=N()?0:i};
const blockSwings=()=>SW().slice(S.block,S.block+S.taken);

function pickSwing(kind){
 const sw=SW();
 if(kind==='focus'){const f=sw.map((w,i)=>({w,i})).filter(o=>o.w.verdict.kind==='focus'&&metricOf(o.w,o.w.verdict.metric));if(!f.length)return-1;
  const cnt={};f.forEach(o=>cnt[o.w.verdict.metric]=(cnt[o.w.verdict.metric]||0)+1);const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  const c=f.filter(o=>o.w.verdict.metric===top&&o.i>0);const best=Math.max(...(c.length?c:f).map(o=>Math.abs(o.w.verdict.level)));
  return(c.length?c:f).find(o=>Math.abs(o.w.verdict.level)===best).i}
 if(kind==='none')return sw.findIndex(w=>!judged(w));
 const i=sw.findIndex((w,k)=>w.verdict.kind===kind&&k>0);return i>=0?i:sw.findIndex(w=>w.verdict.kind===kind)}
function recapOf(sw){
 const jd=sw.filter(judged),cand=[];
 for(const id of new Set(jd.flatMap(w=>w.report.metrics.map(m=>m.id))))for(const sign of[-1,1]){
  const hits=jd.filter(w=>shows(w,id,sign));if(hits.length<Math.max(2,Math.ceil(jd.length/2)))continue;
  const said=sw.filter(w=>w.verdict.kind==='focus'&&w.verdict.metric===id&&Math.sign(w.verdict.level)===sign).length;
  const med=median(hits.map(w=>Math.abs(metricOf(w,id).level)));
  // Worth saying only if the coach would have said it on a swing, or it is well out.
  if(!said&&med<3)continue;
  cand.push({id,sign,n:hits.length,said,med,score:hits.length+1.5*said+.1*med})}
 cand.sort((a,b)=>b.score-a.score||DEF[a.id].position-DEF[b.id].position);
 return{jd,top:cand[0]||null,good:sw.filter(w=>w.verdict.kind==='good'||w.verdict.kind==='better').length}}
function bestBlock(){let best=0,bs=-1;const n=N();for(let i=0;i+BL()<=n;i++){const sw=SW().slice(i,i+BL()),r=recapOf(sw);
  const sc=(r.top?r.top.score:0)+(r.good?1:0)+(r.jd.length===sw.length?1:0);if(sc>bs){bs=sc;best=i}}return best}
function cmpMetrics(sw){const jd=sw.filter(judged),cnt={};jd.forEach(w=>w.report.metrics.forEach(m=>{if(m.level)cnt[m.id]=(cnt[m.id]||0)+1}));
 let ids=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||DEFORDER[a]-DEFORDER[b]).slice(0,6);const top=recapOf(sw).top;
 if(top)ids=[top.id,...ids.filter(i=>i!==top.id)];if(!ids.length){const m=sw.flatMap(w=>w.report.metrics)[0];if(m)ids=[m.id]}return ids}

// ---------- drawings: the same shapes and weights as SwingCoachingOverlay. `u` is frame pixels per screen point.
function shapes(m,u,o={}){
 const sub=o.color||COL[lvl(m.level)],k=o.w||1;let out='';
 for(const s of m.drawings){
  if(o.roles&&!o.roles.includes(s.role))continue;
  const col=s.role==='reference'?'#fff':s.role==='zone'?COL.g:sub,P=s.points.map(p=>[p.x*720,p.y*1280]),size=(s.size||0)*1280;

  if(s.kind==='line'&&P.length===2){const d=`M${f(P[0][0])} ${f(P[0][1])}L${f(P[1][0])} ${f(P[1][1])}`;
   out+=`<path d="${d}" stroke="#000" stroke-opacity=".35" stroke-width="${5*u*k}" stroke-linecap="round" fill="none"${dash}/><path d="${d}" stroke="${col}" stroke-width="${3*u*k}" stroke-linecap="round" fill="none"${dash}/>`}

   out+=`<polygon points="${[[P[0][0]+nx,P[0][1]+ny],[P[1][0]+nx,P[1][1]+ny],[P[1][0]-nx,P[1][1]-ny],[P[0][0]-nx,P[0][1]-ny]].map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="${col}" fill-opacity=".28"/>`}
  else if(s.kind==='circle'&&P.length)out+=`<circle cx="${f(P[0][0])}" cy="${f(P[0][1])}" r="${f(size)}" stroke="#000" stroke-opacity=".35" stroke-width="${5*u*k}" fill="none"${dash}/><circle cx="${f(P[0][0])}" cy="${f(P[0][1])}" r="${f(size)}" stroke="${col}" stroke-width="${3*u*k}" fill="none"${dash}/>`;
  else if(s.kind==='dot'&&P.length)out+=`<circle cx="${f(P[0][0])}" cy="${f(P[0][1])}" r="${6*u*k}" fill="${col}" stroke="#000" stroke-opacity=".6" stroke-width="${1.5*u}"/>`}

// One crop for a set of swings: the golfer (what is drawn at address, the top and impact) plus what is drawn at `pos`.
function cropBox(sw,pos){
 let x0=1,x1=0,y0=1,y1=0;const c=v=>Math.max(0,Math.min(1,v));
 sw.forEach(w=>w.report.metrics.filter(m=>!pos||m.position===pos||[1,4,7].includes(m.position)).forEach(m=>m.drawings.forEach(d=>d.points.forEach(p=>{x0=Math.min(x0,c(p.x));x1=Math.max(x1,c(p.x));y0=Math.min(y0,c(p.y));y1=Math.max(y1,c(p.y))}))));
 if(x1<=x0||y1<=y0)return{x0:0,y0:0,x1:1,y1:1};
 x0=c(x0-.04);x1=c(x1+.04);y0=c(y0-.04);y1=c(y1+.03);
 const grow=(a,b,want)=>{const add=Math.max(0,want-(b-a))/2;a-=add;b+=add;if(a<0){b-=a;a=0}if(b>1){a-=b-1;b=1}return[Math.max(0,a),Math.min(1,b)]};
 [x0,x1]=grow(x0,x1,.42);
 const asp=()=>(x1-x0)*720/((y1-y0)*1280);
 if(asp()<.6)[x0,x1]=grow(x0,x1,.6*(y1-y0)*1280/720);

// Where a metric's white reference sits, to line swings up on each other.

 const lab=(w,k)=>{const m=d&&metricOf(w,id);return{n:S.block+k+1,m,c:m&&judged(w)?lvl(m.level):'n',t:!m?'not measured':!judged(w)?'not judged':fmtVal(m)}};
 let body;
 if(S.cmp.mode==='grid')body=`<div class="grid3">${sw.map((w,k)=>{const L=lab(w,k);
   return`<button class="tile" data-a="open" data-i="${S.block+k}" data-pos="${pos}" data-hl="${L.m?id:''}" data-from="compare">${crop(w,pos,box,118,u=>L.m?shapes(L.m,u):'')}<span class="cap2"><i class="dot ${L.c}"></i>${L.n}<em>${L.t}</em></span></button>`}).join('')}

 ${list.map(s=>{const si=C.sessions.indexOf(s),n=s.swings.length,show=s===cur?8:4,rev=s.swings.map((w,i)=>({w,i})).reverse();

 </div></div>${tabs('library')}`}
function sessionModel(){
 const s=sess(),sw=s.swings,kinds={};sw.forEach(w=>kinds[w.verdict.kind]=(kinds[w.verdict.kind]||0)+1);
 const themes=s.themes.filter(t=>DEF[t.metric]).map(t=>({...t,sign:Math.sign(t.medianLevel)||1}));
 const chain=themes.map((t,i)=>({t,i})).sort((a,b)=>a.t.position-b.t.position||a.i-b.i).map(o=>o.t);
 let pair=null;const main=themes[0];
 if(main){const hits=sw.map((w,i)=>({w,i,m:metricOf(w,main.metric)})).filter(o=>o.m&&judged(o.w));
  const worst=hits.filter(o=>Math.sign(o.m.level)===main.sign).sort((a,b)=>Math.abs(b.m.level)-Math.abs(a.m.level)||b.m.confidence-a.m.confidence)[0];
  const tot=o=>o.w.report.metrics.reduce((a,m)=>a+Math.abs(m.level),0);
  const best=hits.filter(o=>!worst||o.i!==worst.i).sort((a,b)=>Math.abs(a.m.level)-Math.abs(b.m.level)||(b.w.verdict.kind==='good')-(a.w.verdict.kind==='good')||tot(a)-tot(b))[0];
  if(worst&&best)pair={worst,best}}
 const ideas=[];const add=t=>{const i=ideasFor(t.metric,t.sign).find(i=>!ideas.some(x=>x.idea===i));if(i)ideas.push({idea:i,themes:themes.filter(x=>ideasFor(x.metric,x.sign).includes(i))});return!!i};
 const first=chain.find(t=>ideasFor(t.metric,t.sign).length);if(first)add(first);
 const rest=themes.filter(t=>!ideas.some(x=>x.themes.includes(t))).sort((a,b)=>b.swings/b.measured-a.swings/a.measured);
 for(const t of rest){if(ideas.length>=2)break;add(t)}
 return{s,sw,kinds,themes,chain,main,pair,ideas,none:themes.filter(t=>!ideas.some(x=>x.themes.includes(t)))}}
function chartSVG(t,sw){
 const d=DEF[t.metric],W=330,H=112,L=4,R=40,T=8,B=18,pts=sw.map((w,i)=>({i,m:metricOf(w,t.metric),j:judged(w)})).filter(o=>o.m);
 const vals=pts.map(o=>o.m.value),lo=Math.min(d.zoneLow,...vals),hi=Math.max(d.zoneHigh,...vals),pad=(hi-lo)*.08||1;
 const x=i=>L+(sw.length>1?i/(sw.length-1):.5)*(W-L-R),y=v=>T+(1-(v-(lo-pad))/((hi+pad)-(lo-pad)))*(H-T-B);
 const jp=pts.filter(o=>o.j),roll=jp.map((o,k)=>[x(o.i),y(median(jp.slice(Math.max(0,k-3),k+4).map(q=>q.m.value)))]);
 return`<svg viewBox="0 0 ${W} ${H}" data-chart="${t.metric}" role="img" aria-label="${esc(d.title)} for each swing in the order hit">
  <rect x="${L}" y="${y(d.zoneHigh).toFixed(1)}" width="${W-L-R}" height="${(y(d.zoneLow)-y(d.zoneHigh)).toFixed(1)}" fill="${COL.g}" fill-opacity=".16" rx="3"/>
  <text x="${W-R+5}" y="${(y(d.zoneHigh)+4).toFixed(1)}" font-size="10" fill="#a1a1a8">${fmtNum(d.zoneHigh,d.unit)}</text><text x="${W-R+5}" y="${(y(d.zoneLow)+4).toFixed(1)}" font-size="10" fill="#a1a1a8">${fmtNum(d.zoneLow,d.unit)}</text>
  <line x1="${L}" x2="${W-R}" y1="${H-B+3}" y2="${H-B+3}" stroke="#3a3a3c"/><text x="${L}" y="${H-3}" font-size="10" fill="#a1a1a8">Swing 1</text><text x="${W-R}" y="${H-3}" font-size="10" fill="#a1a1a8" text-anchor="end">${sw.length}</text>
  ${roll.length>2?`<polyline points="${roll.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:''}
  ${pts.map(o=>o.j?`<circle cx="${x(o.i).toFixed(1)}" cy="${y(o.m.value).toFixed(1)}" r="3.2" fill="${COL[lvl(o.m.level)]}" stroke="#1c1c1e" stroke-width="1.2"/>`:`<circle cx="${x(o.i).toFixed(1)}" cy="${y(o.m.value).toFixed(1)}" r="2.6" fill="none" stroke="${COL.n}" stroke-width="1.2"/>`).join('')}
  <line class="xh" y1="${T}" y2="${H-B+3}" stroke="#fff" stroke-opacity=".7" stroke-width="1" visibility="hidden"/></svg>`}
function chartRest(t,sw){const d=DEF[t.metric],v=sw.filter(w=>judged(w)&&metricOf(w,t.metric)).map(w=>metricOf(w,t.metric).value),h=Math.floor(v.length/2);
 return v.length>=4?`<span>First half ${fmtNum(median(v.slice(0,h)),d.unit)}, second half ${fmtNum(median(v.slice(h)),d.unit)}</span>`:'<span>Too few swings to show a trend.</span>'}
function buildSession(){
 const M=sessionModel(),{s,sw,kinds,themes,chain,main,pair}=M,you=s.name.dated;
 const jn=sw.filter(judged).length,good=(kinds.good||0),key=[[good,'good','g'],[kinds.better||0,'that’s better','g'],[kinds.focus||0,'one pointer','a'],[sw.length-jn,'not judged','n']].filter(k=>k[0]);
 let h=`<p class="when">${esc(s.name.day)}${s.name.kind?' · '+esc(s.name.kind):''} · ${you?plural(sw.length,'swing')+', in the order hit':plural(sw.length,'clip')}</p>
  <div class="dots">${sw.map((w,i)=>`<button class="${vcls(w)}" data-a="open" data-i="${i}" data-from="session" title="Swing ${i+1}: ${esc(w.verdict.headline)}" aria-label="Swing ${i+1}: ${esc(w.verdict.headline)}"></button>`).join('')}</div>
  <div class="key">${key.map(([n,l,c])=>`<span><i class="dot ${c}"></i><b>${n}</b> ${l}</span>`).join('')}</div>`;
 if(!main)h+=`<div class="card"><h4>${jn<4?'Not enough swings to see a pattern yet':'Nothing kept repeating'}</h4><p class="sub">${jn<4?`Only ${jn} of ${sw.length} could be judged.`:'No single fault showed up on half the swings.'}</p></div>`;
 else{
  const d=DEF[main.metric];
  h+=`<div class="card"><div class="start">Start here</div><h4>${esc(main.text)}</h4><p class="sub">${main.swings} of ${main.measured} swings · ${pname(main.position)} · usually level ${Math.abs(main.medianLevel)}</p>`;
  if(pair){const box=cropBox([pair.worst.w,pair.best.w],main.position),cell=(o,title)=>`<button data-a="open" data-i="${o.i}" data-pos="${main.position}" data-hl="${main.metric}" data-from="session">${crop(o.w,main.position,box,161,u=>shapes(o.m,u))}<span class="pc"><b>${title}</b><span>Swing ${o.i+1} · ${o.m.level?`level ${Math.abs(o.m.level)}`:'in zone'} · ${fmtVal(o.m)}</span></span></button>`;
   h+=`<div class="pair">${cell(pair.worst,'Shows it most')}${cell(pair.best,you?(pair.best.m.level?'Your closest':'Your best here'):(pair.best.m.level?'The closest':'The best here'))}</div>`}
  h+=`</div><div class="card"><h3>How the faults link</h3>${chain.length>1?'':'<p class="sub" style="margin:0 0 10px">Only one fault kept repeating, so there is nothing to link it to.</p>'}<div class="chain">${chain.map((t,k)=>{
    let link='';if(k<chain.length-1){const nx=chain[k+1],both=sw.filter(w=>shows(w,t.metric,t.sign)&&shows(w,nx.metric,nx.sign)).length;link=`<div class="link"><i></i>Both on ${plural(both,'swing')}</div>`}
    return`<div class="node"><span class="p ${lvl(t.medianLevel)}">P${t.position}</span><span><b>${esc(t.text)}</b><span>${t.swings} of ${t.measured} swings${t===chain[0]&&chain.length>1?' · the earliest, so work on this first':''}</span></span></div>${link}`}).join('')}</div></div>
  <div class="card"><h3>Swing by swing</h3>${chain.map(t=>{const td=DEF[t.metric];return`<div class="ch"><div class="hd"><span>${esc(td.title)}</span><em>green band ${fmtNum(td.zoneLow,td.unit)} to ${fmtNum(td.zoneHigh,td.unit)}</em></div>${chartSVG(t,sw)}<div class="ro" data-rest="${esc(chartRest(t,sw))}">${chartRest(t,sw)}</div></div>`}).join('')}</div>`;
  h+=`<div class="sec">Try at home</div><p class="secsub">Ideas taken from coaching videos saved in the repo. No coach has reviewed them for ${you?'your':'this'} swing.</p>`;
  h+=M.ideas.map(({idea:i,themes:ts})=>`<div class="idea"><div class="tags"><span>${esc(i.prop)}</span><span class="un">Idea, not reviewed by a coach</span></div><h4>${esc(i.title)}</h4><p class="for">For: ${ts.map(t=>esc(t.text.toLowerCase())).join('; ')}</p>
    <ol>${i.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p>${esc(i.why)}</p><p class="src"><b>${esc(i.who)}</b><br><code>${esc(i.file)}</code><br>${esc(i.limit)}</p></div>`).join('');
  if(M.none.length)h+=`<p class="empty">No saved idea yet for: ${M.none.map(t=>esc(t.text.toLowerCase())).join('; ')}.</p>`}
 return`<div class="page ses"><div class="nav"><span></span><h2>Session coaching</h2><button class="done" data-a="back">Done</button></div><div class="scroll" data-scroll="ses">${h}</div></div>`}

 hit,noop(){},

 scr3(b){S.screen=b.dataset.v;S.sheet=null},
 sheet(b){S.sheet=b.dataset.s;S.fresh='sheet'},closesheet(){S.sheet=null},
 speak(b){S.speak=b.dataset.k||b.dataset.v;S.sheet=null;S.recap=false;S.phase='idle';
  if(S.speak==='each'){S.flow=1;S.swing=Math.min(N()-1,Math.max(0,lastIdx()+1));S.hit=false}else{if(S.flow!==2){S.block=Math.min(Math.max(0,N()-BL()),nextIdx());S.taken=0}S.flow=2}},
 openlast(){const i=lastIdx();if(i>=0&&S.phase!=='reading')openReview(i,'capture')},

 compare(){S.screen='compare';S.cmp.id=(recapOf(blockSwings()).top||{}).id||null},
 cmpmode(b){S.cmp.mode=b.dataset.m},cmpid(b){S.cmp.id=b.dataset.id},
 open(b){if(b.dataset.si!==undefined&&+b.dataset.si!==S.si)return;openReview(+b.dataset.i,b.dataset.from,+b.dataset.pos||0,b.dataset.hl||null)},
 session(b){if(b.dataset.si!==undefined&&+b.dataset.si!==S.si)setSession(+b.dataset.si);S.flow=3;S.screen='session'},
 back(){S.playing=false;S.sheet=null;if(S.screen==='review')S.screen=S.rv.from;else if(S.screen==='compare')S.screen='capture';else if(S.screen==='session')S.screen='library'},
 prev(){S.playing=false;setPos(S.rv.pos-1)},next(){S.playing=false;setPos(S.rv.pos+1)},play,
 eye(){S.draw=S.draw==='coach'?'all':'coach';S.hl=null},
 pill(){const v=SW()[S.rv.i].verdict,fp=v.kind==='focus'&&DEF[v.metric]?DEF[v.metric].position:null;if(fp&&(S.rv.pos!==fp||S.hl)){S.rv.pos=fp;S.hl=null}else{S.sheet='checks';S.fresh='sheet'}},
 draw(b){if(b.dataset.d==='mine'&&S.draw!=='mine')seedMine();S.draw=b.dataset.d;S.hl=null},
 toggle(b){if(S.draw!=='mine'){seedMine();S.draw='mine'}S.hl=null;S.mine[b.dataset.id]=!S.mine[b.dataset.id]},
 jump(b){const m=metricOf(SW()[S.rv.i],b.dataset.id);if(m){S.rv.pos=m.position;S.hl=m.id;S.sheet=null}}};
function seedMine(){const w=SW()[S.rv.i],hl=S.hl;S.hl=null;S.mine={};if(S.draw==='all')C.definitions.forEach(d=>S.mine[d.id]=true);else drawnIds(w).forEach(i=>S.mine[i]=true);S.hl=hl}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const fn=ACT[b.dataset.a];if(!fn)return;
 if(b.dataset.a==='hit'||b.dataset.a==='play'){fn(b);return}fn(b);render()});
// strip and timeline: tap or drag picks the nearest position
function dragPick(sel,pick){let on=false;ph.addEventListener('pointerdown',e=>{const el=e.target.closest(sel);if(!el)return;on=el;S.playing=false;pick(el,e);e.preventDefault()});
 addEventListener('pointermove',e=>{if(on&&on.isConnected)pick(on,e)});addEventListener('pointerup',()=>on=false);addEventListener('pointercancel',()=>on=false)}
dragPick('#strip',(el,e)=>{const r=el.getBoundingClientRect(),np=SW()[S.rv.i].positions.length,p=Math.floor((e.clientX-r.left)/r.width*np)+1;if(p!==S.rv.pos||S.hl){setPos(p);render()}});
dragPick('#tl',(el,e)=>{const r=el.getBoundingClientRect(),q=(e.clientX-r.left)/r.width,xs=tlx(SW()[S.rv.i]);let b=0;xs.forEach((x,i)=>{if(Math.abs(x-q)<Math.abs(xs[b]-q))b=i});if(b+1!==S.rv.pos||S.hl){setPos(b+1);render()}});
// charts: hover or tap a point for its swing
function chartAt(e){const svg=e.target.closest('svg[data-chart]');if(!svg)return;const sw=SW(),id=svg.dataset.chart,r=svg.getBoundingClientRect(),q=(e.clientX-r.left)/r.width*330;
 let best=null;sw.forEach((w,i)=>{const m=metricOf(w,id);if(!m)return;const x=4+(sw.length>1?i/(sw.length-1):.5)*286;if(!best||Math.abs(x-q)<Math.abs(best.x-q))best={x,i,m,w}});if(!best)return;
 const xh=svg.querySelector('.xh');xh.setAttribute('x1',best.x);xh.setAttribute('x2',best.x);xh.setAttribute('visibility','visible');
 svg.parentNode.querySelector('.ro').innerHTML=`<span>Swing ${best.i+1}: ${fmtVal(best.m)}, ${!judged(best.w)?'not judged':best.m.level?`level ${Math.abs(best.m.level)}`:'in zone'}</span><button data-a="open" data-i="${best.i}" data-pos="${DEF[id].position}" data-hl="${id}" data-from="session">Open swing</button>`}
ph.addEventListener('pointermove',chartAt);ph.addEventListener('pointerdown',chartAt);

// ---------- boot
function fit(){const pw=document.getElementById('pw'),wide=matchMedia('(min-width:761px)').matches,top=pw.parentNode.offsetTop;
 pw.style.maxWidth=Math.round(Math.min(390,wide?Math.max(260,(innerHeight-top-16)*390/844):390))+'px';ph.style.transform=`scale(${pw.clientWidth/390})`}
addEventListener('resize',fit);
(function boot(){
 const ql=Q.get('session'),qi=C.sessions.findIndex(s=>s.label===ql);setSession(qi>=0?qi:0);
 const f=+Q.get('flow');setFlow(f>=1&&f<=3?f:1);
 if(Q.get('speak')&&SPEAK[Q.get('speak')])S.speak=Q.get('speak');
 const qs=+Q.get('swing');if(qs>=1&&qs<=N())S.swing=qs-1;
 if(Q.get('draw')&&['coach','all','mine'].includes(Q.get('draw')))S.draw=Q.get('draw');
 if(Q.get('said')){S.hit=true;S.phase='said'}
 if(Q.get('taken')){S.taken=Math.max(0,Math.min(BL(),+Q.get('taken')))}
 if(Q.get('recap')){S.taken=S.taken||BL();S.recap=true}
 if(Q.get('cmp'))S.cmp.mode=Q.get('cmp')==='over'?'over':'grid';
 const sc=Q.get('screen');
 if(sc==='review'){const from=S.flow===3?'library':'capture';if(S.flow!==3){S.hit=true;S.phase='said'}openReview(S.swing,from,+Q.get('pos')||0)}
 else if(sc==='compare'&&S.flow===2){S.taken=S.taken||BL();S.recap=true;ACT.compare()}
 else if((sc==='session'||sc==='library')&&S.flow===3)S.screen=sc;
 if(Q.get('sheet'))S.sheet=Q.get('sheet');
 fit();render();
 const sy=+Q.get('scroll');if(sy){const el=ph.querySelector('[data-scroll]');if(el)el.scrollTop=sy}
})();
</script></body></html>
