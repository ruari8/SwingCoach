<style>

ottom:0;left:0;right:0;height:250px;background:#141b17;border-radius:29px 29px 0 0;padding:23px 27px}.b .dock-top{display:flex;justify-content:space-between;align-items:center}.b .dock-top .saved{border-left:1px solid #ffffff25;padding-left:20px}.b .dock-top .saved strong{font-size:25px}.b .dock-top .saved small{font-size:11px}.b .dock .modes{position:absolute;top:99px;left:25px;right:25px;justify-content:center;border-top:1px solid #ffffff1a;padding-top:13px;gap:30px}.b .dock .modes button.selected{color:var(--accent)}.b .dock .modes .selected:after{content:"";display:block;height:3px;width:16px;border-radius:3px;background:var(--accent);margin:7px auto -10px}.b .brand{font-family:Georgia,serif;font-style:italic;font-size:23px}.b .dock-top .stop{height:64px;width:64px}.b .dock-top .timer{font-size:24px}.b .dock-top .record-area{gap:0}.b .dock-top .record-area small{display:none}.c .top-panel{position:absolute;top:59px;left:0;right:0;background:#101813ef;padding:15px 24px 18px;border-bottom:1px solid #ffffff22}.c .top-panel .row{display:flex;align-items:center;justify-content:space-between}.c .top-panel .row+.row{border-top:1px solid #ffffff25;margin-top:9px;padding-top:13px}.c .top-panel .modes button{padding-left:0;margin-right:22px;font-size:18px}.c .top-panel .modes .selected{color:var(--accent)}.c .scene{top:177px;bottom:88px}.c .system{background:#101813}.c .filmstrip{position:absolute;bottom:107px;left:25px;right:25px;display:flex;justify-content:space-between;align-items:end}.c .filmstrip .saved{flex-direction:column;align-items:start;gap:8px}.c .filmstrip .thumbs{display:flex;gap:5px}.c .filmstrip .thumb{width:39px;height:49px}.c .filmstrip .saved strong{font-size:13px}.c .record-area{position:absolute;bottom:111px;left:157px}.c .nav{left:0;right:0;bottom:23px;background:#0a0e0c;height:65px;padding-top:10px}.d{background:#e8e7df;color:#202a22}.d .scene{top:144px;bottom:244px;left:13px;right:13px;border-radius:13px;background-size:cover;background-position:center 47%}.d .shade{display:none}.d .system{color:#202a22}.d .toprow{top:77px;left:25px;right:25px}.d .toprow .modes{gap:15px}.d .toprow .modes button{padding:0;position:relative;font-family:Georgia,serif;font-size:23px;font-weight:400}.d .toprow .modes button.selected:after{content:"";position:absolute;bottom:1px;left:0;right:0;height:2px;background:#243a2b}.d .below{position:absolute;top:622px;left:27px;right:27px;display:flex;align-items:center;justify-content:space-between}.d .status{font-size:14px}.d .dot{background:#577944}.d .saved{text-align:right;flex-direction:column;align-items:end;gap:0}.d .saved strong{font-size:37px;font-weight:400;font-family:Georgia,serif;line-height:1}.d .saved small{font-size:12px}.d .saved .thumb,.d .saved svg{display:none}.d .nav{border-top:1px solid #273b2b26;padding-top:15px;height:67px}.d .nav button.active{color:#26482e}.d .stop{border-color:#283b2d;width:67px;height:67px}.d .record-area small{display:none}.d .timer{font-size:24px}.d .red{background:#cf4943}.e .toprow{top:72px}.e .top-status{font-size:13px;letter-spacing:.1px}.e .bottom-controls{position:absolute;bottom:108px;left:24px;right:24px;display:flex;flex-direction:column;align-items:center;gap:16px}.e .bottom-controls .modes{gap:13px;justify-content:center}.e .bottom-controls .modes button{padding:0 17px}.e .bottom-controls .modes button.selected{color:var(--accent)}.e .bottom-controls .modes button.selected:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;vertical-align:middle;margin-right:7px}.e .saved{border:1px solid #fff4;border-radius:24px;padding:4px 16px;min-height:44px;background:#172017c9;gap:7px}.e .saved .thumb,.e .saved small{display:none}.e .saved strong{font-size:14px}.e .nav{border-top:1px solid #fff2;padding-top:10px}.e .record-area{gap:0}.e .record-area small{display:none}.e .bottom-controls.manual{gap:8px}.sheet{position:absolute;inset:0;z-index:10;background:#111913f7;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:35px;text-align:center}.sheet h3{font-size:26px;font-weight:500}.sheet p{font-size:14px;line-height:1.6;color:#b7c3b5}.sheet button{padding:13px 24px;background:#d1ed96;color:#183020;border-radius:26px;margin-top:12px}.sheet .review-image{height:310px;width:180px;background:url(../media/camera.jpg) center/cover;border-radius:12px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:7px;background:#263027;color:white;display:flex;gap:5px;align-items:center;border-radius:30px;box-shadow:0 6px 25px #0002;z-index:30;white-space:nowrap}.switcher button{min-width:37px;height:35px;border-radius:25px;font-size:12px}.switcher button.chosen{background:#d5e6b7;color:#213020}.switcher .all{padding:0 16px}.switcher .sep{width:1px;height:20px;background:#ffffff35;margin:0 7px}.footnote{position:fixed;bottom:27px;left:42px;color:#747c70;font-size:11px;max-width:270px;line-height:1.5}.gallery.focused{grid-template-columns:repeat(2,310px);justify-content:center;gap:70px;margin-top:30px}.focused .study-head .mode-label{font-size:13px;font-weight:600}.focused .caption{max-width:310px}.focused .caption h2{margin-top:17px}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#243d2a;color:white;padding:11px 20px;border-radius:8px;font-size:13px;z-index:99;display:none}@media(min-width:1800px){.gallery{max-width:1670px;margin-left:auto;margin-right:auto}}@media(max-width:1100px){header{padding:25px;align-items:start;gap:25px}h1{font-size:31px}.toolbar{flex-direction:column;gap:4px}.gallery{grid-template-columns:repeat(3,minmax(0,1fr));margin:25px 25px 100px}.footnote{display:none}.gallery.focused{grid-template-columns:repeat(2,minmax(0,310px));gap:25px}}@media(max-width:650px){header{display:block;padding:24px 20px}.toolbar{margin-top:20px;flex-direction:row;justify-content:space-between}.gallery{grid-template-columns:1fr;max-width:340px;margin:25px auto 100px;gap:35px}.gallery. </style></head><body>
<header><div><div class="eyebrow">SwingCoach / Capture design study</div><h1>Let the camera breathe.</h1><p>Five directions. The same camera. Just the controls that earn their place.</p></div><div class="toolbar"><div class="global-modes"><button data-global="auto" class="on">Auto</button><button data-global="manual">Manual · recording</button></div><button class="demo" id="demo">Simulate a saved swing</button></div></header>
<main class="gallery" id="gallery"></main><div class="footnote">Interactive mockups · Camera image from your range video.<br>Tap a mode, saved count, or recording control.</div><nav class="switcher" aria-label="Design variants"><button id="prev" aria-label="Previous design">←</button><button class="all chosen" data-variant="all">All five</button><span class="sep"></span><button data-variant="1">01</button><button data-variant="2">02</button><button data-variant="3">03</button><button data-variant="4">04</button><button data-variant="5">05</button><button id="next" aria-label="Next design">→</button></nav><div class="toast" role="status"></div>
<script>
const paths={library:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 2h9M8 9h8M8 13h5"/>',capture:'<path d="M8 5l1.5-2h5L16 5h3a2 2 0 012 2v11a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/><circle cx="12" cy="12" r="4"/>',coach:'<path d="M20 11a8 8 0 01-8 8H5l-3 2V11a9 9 0 0118 0z"/><path d="M7 9h8M7 13h5"/>',chevron:'<path d="M9 5l7 7-7 7"/>',down:'<path d="M6 9l6 6 6-6"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]}</svg>`;
const designs=[{key:'a',name:'Quiet camera',desc:'A small active status and saved-swing shortcut. Everything else stays out of the view.',manual:'The timer sits above the view. One familiar stop button below.',recommended:true},{key:'b',name:'Control dock',desc:'Status, saved count and modes share one grounded panel. The viewfinder stays clear.',manual:'The same dock becomes a timer and stop control. Nothing floats over the golfer.'},{key:'c',name:'Session strip',desc:'A narrow strip carries the live status. Recent swings collect in the lower corner.',manual:'Recording time replaces the Auto status in the strip. Stop stays at the bottom.'},{key:'d',name:'Light frame',desc:'A warm, solid frame separates the camera from its controls. A quieter, more editorial direction.',manual:'Dark text and a distinct stop control on the light frame. Less preview area, more separation.'},{key:'e',name:'Within reach',desc:'Mode selection and saved swings sit together near your thumb. A tiny status remains at the top.',manual:'The stop control sits directly above the mode labels, with elapsed time at the top.'}];
let mode='auto',saved=3,variant=new URLSearchParams(location.search).get('variant')||'all';if(!['all','1','2','3','4','5'].includes(variant))variant='all';
const system=()=>`<div class="system"><span>9:41</span><div class="island"></div><span class="sys-right"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="battery"></span></span></div><div class="home"></div>`;
const nav=()=>`<div class="nav"><button data-nav="Library">${icon('library')}Library</button><button class="active" aria-current="page" data-nav="Capture">${icon('capture')}Capture</button><button data-nav="Coach">${icon('coach')}Coach</button></div>`;
const modes=(m,seg=false)=>`<div class="modes ${seg?'seg':''}"><button data-mode="manual" class="${m==='manual'?'selected':''}" aria-pressed="${m==='manual'}">Manual</button><button data-mode="auto" class="${m==='auto'?'selected':''}" aria-pressed="${m==='auto'}">Auto</button></div>`;
const fps=()=>`<button class="fps" aria-label="Capture frame rate"><span>240 fps</span>${icon('down')}</button>`;
const status=(label='Auto is on')=>`<div class="status"><i class="dot"></i>${label}</div>`;
const count=()=>`<button class="saved" aria-label="Review ${saved} saved swings"><span class="thumb"></span><span><strong>${saved} saved</strong><small>This session</small></span>${icon('chevron')}</button>`;
const timer=()=>`<div class="timer"><i class="dot red"></i>00:05.5</div>`;
const stop=()=>`<div class="record-area"><button class="stop" aria-label="Stop recording"><span></span></button><small>Stop</small></div>`;
function phone(index,m){const d=designs[index];let ui='';if(index===0)ui=`<div class="toprow">${fps()}${modes(m,true)}</div>${m==='auto'?`<div class="bottomrow"><div class="auto-state">${status()}<small>Swings save automatically</small></div>${count()}</div>`:`<div class="manual-clock">${timer()}</div>${stop()}`}`;
if(index===1)ui=`<div class="toprow"><span class="brand">SwingCoach</span>${fps()}</div><div class="dock"><div class="dock-top">${m==='auto'?`${status('Saving swings')}<button class="saved" aria-label="Review ${saved} saved swings"><span><strong>${String(saved).padStart(2,'0')}</strong><small>saved ${icon('chevron')}</small></span></button>`:`${timer()}${stop()}`}</div>${modes(m)}</div>`;
if(index===2)ui=`<div class="top-panel"><div class="row">${modes(m)}${fps()}</div><div class="row">${m==='auto'?`${status('Auto is on')}<span style="font-size:12px;opacity:.6">Saves automatically</span>`:`${timer()}<span style="font-size:12px;opacity:.6">Recording</span>`}</div></div>${m==='auto'?`<div class="filmstrip"><button class="saved" aria-label="Review ${saved} saved swings"><span class="thumbs">${Array.from({length:Math.min(saved,3)},()=>'<span class="thumb"></span>').join('')}</span><strong>${saved} swings saved &nbsp; ›</strong></button></div>`:stop()}`;
if(index===3)ui=`<div class="toprow">${modes(m)}${fps()}</div><div class="below">${m==='auto'?`<div>${status('Auto is on')}<div style="font-size:11px;opacity:.6;margin-top:9px">Swings save automatically</div></div><button class="saved" aria-label="Review ${saved} saved swings"><strong>${String(saved).padStart(2,'0')}</strong><small>saved swings ›</small></button>`:`${timer()}${stop()}`}</div>`;
if(index===4)ui=`<div class="toprow"><span class="top-status">${m==='auto'?status():timer()}</span>${fps()}</div><div class="bottom-controls ${m}">${m==='auto'?count():stop()}${modes(m)}</div>`;
return `<div class="phone-wrap"><div class="phone ${d.key}" data-index="${index}" data-mode-state="${m}"><div class="scene"></div><div class="shade"></div>${system()}${ui}${nav()}</div></div>`;}
function render(){document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('chosen',b.dataset.variant===variant));document.querySelectorAll('[data-global]').forEach(b=>b.classList.toggle('on',b.dataset.global===mode));document.querySelector('.global-modes').style.opacity=variant==='all'?'1':'.45';const g=document.getElementById('gallery');g.classList.toggle('focused',variant!=='all');if(variant==='all')g.innerHTML=designs.map((d,i)=>`<article class="study"><div class="study-head"><span class="number">0${i+1}</span><button data-focus="${i+1}">Compare modes ↗</button></div>${phone(i,mode)}<div class="caption"><h2>${d.name}${d.recommended?'<span class="recommended">My pick</span>':''}</h2><p>${mode==='auto'?d.desc:d.manual}</p></div></article>`).join('');else{let i=Number(variant)-1;g.innerHTML=['auto','manual'].map(m=>`<article class="study"><div class="study-head"><span class="number">0${i+1} / ${designs[i].name}</span><span class="mode-label">${m==='auto'?'Auto':'Manual'}</span></div>${phone(i,m)}<div class="caption"><p>${m==='auto'?designs[i].desc:designs[i].manual}</p></div></article>`).join('')}scale();}
function scale(){document.querySelectorAll('.phone-wrap').forEach(w=>w.firstElementChild.style.transform=`scale(${w.clientWidth/390})`)}window.addEventListener('resize',scale);
function choose(v){variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);render()}
function cycle(delta){let list=['all','1','2','3','4','5'];choose(list[(list.indexOf(variant)+delta+6)%6])}
function sheet(p,title,body,review=false){p.insertAdjacentHTML('beforeend',`<div class="sheet" role="dialog" aria-label="${title}">${review?'<div class="review-image"></div>':''}<h3>${title}</h3><p>${body}</p><button data-close>Back to camera</button></div>`)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let p=b.closest('.phone');if(b.dataset.variant)choose(b.dataset.variant);if(b.dataset.focus)choose(b.dataset.focus);if(b.dataset.global){mode=b.dataset.global;variant='all';choose('all')}if(b.dataset.mode){if(p.dataset.modeState==='manual'&&b.dataset.mode==='auto'){sheet(p,'Recording in progress','Stop the recording before switching modes.');return}let i=Number(p.dataset.index);p.closest('.phone-wrap').outerHTML=phone(i,b.dataset.mode);scale()}if(b.id==='prev')cycle(-1);if(b.id==='next')cycle(1);if(b.classList.contains('saved'))sheet(p,`${saved} saved swings`,'Auto capture pauses while you review. This prototype uses one sample frame for all clips.',true);if(b.classList.contains('stop'))sheet(p,'Trim your recording','Stopping Manual capture opens the existing trim editor. This study covers the camera screen.');if(b.classList.contains('fps')){if(p.dataset.modeState==='manual'){sheet(p,'240 fps','Frame rate is locked while recording.');return}let span=b.querySelector('span');let rates=['30 fps','60 fps','120 fps','240 fps'];span.textContent=rates[(rates.indexOf(span.textContent)+1)%4]}if(b.hasAttribute('data-close'))b.closest('.sheet').remove();if(b.dataset.nav&&b.dataset.nav!=='Capture')sheet(p,b.dataset.nav,`This opens ${b.dataset.nav} in the app. The prototype only explores Capture.`);if(b.id==='demo'){saved++;render();const t=document.querySelector('.toast');t.textContent=`Swing saved · ${saved} this session`;t.style.display='block';setTimeout(()=>t.style.display='none',1700)}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1);if(e.key==='Escape')document.querySelectorAll('.sheet').forEach(s=>s.remove())});render();
</script></body></html>
